version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: rent_read-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Test@1234
      MYSQL_DATABASE: rent_read_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rent_read-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  rent_read-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rent_read-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rentread_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Test@1234
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rent_read-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  rent_read-network:
    driver: bridge